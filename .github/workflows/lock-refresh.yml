name: Refresh npm lockfile

on:
  push:
    branches: [main]
    paths:
      - 'backend/package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Refresh and commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            npm install --package-lock-only --ignore-scripts --prefix backend
            if git diff --quiet -- backend/package-lock.json; then
              echo "Lockfile already current."
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/package-lock.json
            git commit -m "chore: refresh npm lockfile"
            if git push origin HEAD:main; then
              echo "Lockfile update pushed successfully."
              exit 0
            fi
            echo "Push raced with another commit; retrying from latest main (attempt ${attempt}/3)."
          done
          echo "Unable to update lockfile after 3 attempts."
          exit 1
