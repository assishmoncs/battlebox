name: Refresh npm lockfile

on:
  push:
    branches: [main]
    paths:
      - 'backend/package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Refresh lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Rebase on latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "chore: refresh npm lockfile"
          git push origin HEAD:main
